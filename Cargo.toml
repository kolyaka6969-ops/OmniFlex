[package]
name = "omniflex"
version = "1.3.2"
edition = "2021"
description = "OmniFlex вЂ” РѕСЃС‚СЂРѕРІ РІРІРµСЂС…Сѓ СЌРєСЂР°РЅР° Рё РјРёРєС€РµСЂ РіСЂРѕРјРєРѕСЃС‚Рё РґР»СЏ Windows"
authors = ["kolyaka6969-ops"]
build = "build.rs"

[[bin]]
name = "OmniFlex"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
raw-window-handle = "0.6"
windows-core = "0.58"
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "http2", "cookies", "json", "multipart"] }
futures = "0.3"
regex = "1"
fancy-regex = "0.14"
encoding_rs = "0.8"
sha2 = "0.10"
chrono = "0.4"
html-escape = "0.2"
urlencoding = "2"
base64 = "0.22"
rqrr = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }

[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Media_Ocr",
    "Media_SpeechRecognition",
    "Globalization",
    "Graphics_Imaging",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_MediaFoundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
